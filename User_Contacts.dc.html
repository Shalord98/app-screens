<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contacts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button,input{font-family:inherit}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="padding:28px 20px 14px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:26px;font-weight:800;letter-spacing:-0.5px">Contacts</span>
      <a href="User_NewContact.dc.html" aria-label="New contact" style="width:44px;height:44px;border-radius:22px;background:#0F766E;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>
    <div style="position:relative">
      <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search contacts</label>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:14px;top:14px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Search name, company, notes" style="width:100%;height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:14px;padding:0 14px 0 44px;font-size:15px;background:#FFFFFF;color:#14213D">
    </div>
    <div style="display:flex;gap:8px;overflow:hidden">
      <button style="height:36px;padding:0 16px;border-radius:18px;border:none;background:#0F766E;color:#FFFFFF;font-weight:600;font-size:13px">All</button>
      <button style="height:36px;padding:0 16px;border-radius:18px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:600;font-size:13px">Investors</button>
      <button style="height:36px;padding:0 16px;border-radius:18px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:600;font-size:13px">Government</button>
      <button style="height:36px;padding:0 16px;border-radius:18px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:600;font-size:13px">Vendors</button>
    </div>
  </div>

  <div style="flex:1;overflow:hidden;padding:0 20px;display:flex;flex-direction:column">
    <span style="font-size:12px;font-weight:700;color:#5B6472;padding:4px 0 8px;letter-spacing:0.6px">RECENT</span>
    <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
      <a href="User_ContactSummary.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #E6E2D8;min-height:44px">
        <span style="width:44px;height:44px;border-radius:22px;background:{{p.bg}};color:{{p.fg}};font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none">{{p.initials}}</span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15px;font-weight:700">{{p.name}}</span>
          <span style="font-size:12.5px;color:#5B6472">{{p.role}}</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none">
          <span style="font-size:12px;font-weight:700">{{p.count}} logs</span>
          <span style="font-size:11.5px;color:#5B6472">{{p.last}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="height:76px;flex:none;background:#FFFFFF;border-top:1px solid #E6E2D8;display:flex;justify-content:space-around;align-items:center;padding:0 8px 8px;box-sizing:border-box">
    <a href="User_Today.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</a>
    <a href="User_Contacts.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#0F766E;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Contacts</a>
    <a href="User_Followups.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>Follow-ups</a>
    <a href="User_History.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>History</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = { bg: '#DDF1EE', fg: '#0B5C55' };
    const b = { bg: '#E8E4F5', fg: '#3F2F8F' };
    const c = { bg: '#FDE7E1', fg: '#9A3412' };
    const d = { bg: '#E3EAF7', fg: '#1E3A8A' };
    return {
      people: [
        { initials: 'KF', name: 'Karim Fadel', role: 'Account Director · Gulf Logistics', count: 7, last: 'Today', ...a },
        { initials: 'DW', name: 'Daniel Wright', role: 'Partner · Northgate Capital', count: 12, last: 'Today', ...b },
        { initials: 'LH', name: 'Layla Haddad', role: 'CFO · Internal', count: 31, last: 'Today', ...c },
        { initials: 'PN', name: 'Priya Nair', role: 'Counsel · Nair &amp; Co', count: 5, last: 'Today', ...d },
        { initials: 'OR', name: 'Omar Rashid', role: 'Head of Strategy · Internal', count: 18, last: 'Yesterday', ...a },
        { initials: 'AM', name: 'Amal Mansoor', role: 'Director · Gulf Logistics', count: 3, last: '14 Oct', ...b }
      ].map(function (p) { return { ...p, role: p.role.replace('&amp;', '&') }; })
    };
  }
}
</script>
</body>
</html>
