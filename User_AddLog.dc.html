<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add Log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button,input,textarea{font-family:inherit}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="padding:28px 20px 10px;display:flex;align-items:center;justify-content:space-between">
    <a href="User_Today.dc.html" aria-label="Close" style="width:44px;height:44px;border-radius:22px;border:1px solid #D9D5CB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#14213D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-size:18px;font-weight:800">New log</span>
    <span style="width:44px"></span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:14px">

    <div style="display:flex;gap:8px">
      <button style="height:38px;padding:0 14px;border-radius:19px;border:none;background:#0F766E;color:#FFFFFF;font-weight:700;font-size:13px">Meeting</button>
      <button style="height:38px;padding:0 14px;border-radius:19px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:600;font-size:13px">Call</button>
      <button style="height:38px;padding:0 14px;border-radius:19px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:600;font-size:13px">Email</button>
      <button style="height:38px;padding:0 14px;border-radius:19px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:600;font-size:13px">Task</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="title" style="font-size:12px;font-weight:700;color:#5B6472">Title</label>
      <input id="title" value="Vendor contract review" style="height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px;font-size:15px;font-weight:600;background:#FFFFFF;color:#14213D">
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="date" style="font-size:12px;font-weight:700;color:#5B6472">Date</label>
        <input id="date" value="20 Oct 2026" style="height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px;font-size:14px;background:#FFFFFF;color:#14213D">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="time" style="font-size:12px;font-weight:700;color:#5B6472">Time</label>
        <input id="time" value="14:00 – 15:00" style="height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px;font-size:14px;background:#FFFFFF;color:#14213D">
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="loc" style="font-size:12px;font-weight:700;color:#5B6472">Location</label>
      <div style="position:relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position:absolute;left:14px;top:15px"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <input id="loc" value="Boardroom 2" placeholder="Type any place, e.g. Boardroom 2, Zoom, client office" style="width:100%;height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px 0 40px;font-size:14px;background:#FFFFFF;color:#14213D">
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="people" style="font-size:12px;font-weight:700;color:#5B6472">Participants</label>
      <div style="background:#FFFFFF;border:2px solid #0F766E;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span style="background:#DDF1EE;color:#0B5C55;border-radius:14px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px">Karim Fadel
            <span aria-hidden="true" style="width:18px;height:18px;border-radius:9px;background:#0B5C55;color:#FFFFFF;font-size:12px;display:flex;align-items:center;justify-content:center">×</span></span>
        </div>
        <input id="people" value="Ame" style="height:32px;box-sizing:border-box;border:none;outline:none;font-size:14px;background:transparent;color:#14213D;padding:0 2px">
      </div>
      <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:12px;overflow:hidden;box-shadow:0 6px 16px rgba(20,33,61,0.08)">
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #EFEBE2">
          <span style="width:32px;height:32px;border-radius:16px;background:#E8E4F5;color:#3F2F8F;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">AM</span>
          <div style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:700">Amal Mansoor</span><span style="font-size:12px;color:#5B6472">Director · Gulf Logistics</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #EFEBE2">
          <span style="width:32px;height:32px;border-radius:16px;background:#FDE7E1;color:#9A3412;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center">AB</span>
          <div style="display:flex;flex-direction:column"><span style="font-size:14px;font-weight:700">Ameer Baig</span><span style="font-size:12px;color:#5B6472">Legal Counsel · Baig &amp; Partners</span></div>
        </div>
        <a href="User_NewContact.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;color:#0B5C55;font-weight:700;font-size:14px;min-height:44px;box-sizing:border-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Create new contact “Ame”
        </a>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="emp" style="font-size:12px;font-weight:700;color:#5B6472">Shared with employees</label>
      <div style="background:#FFFFFF;border:1px solid #D9D5CB;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <sc-for list="{{shared}}" as="e" hint-placeholder-count="2">
            <sc-if value="{{e.locked}}" hint-placeholder-val="{{false}}">
              <span style="min-height:36px;box-sizing:border-box;background:#E3EAF7;color:#1E3A8A;border-radius:18px;padding:0 12px 0 5px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px">
                <span style="width:26px;height:26px;border-radius:13px;background:{{e.avBg}};color:{{e.avFg}};font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">{{e.ini}}</span>
                <span>{{e.name}} (you)</span>
              </span>
            </sc-if>
            <sc-if value="{{e.removable}}" hint-placeholder-val="{{true}}">
              <button onClick="{{e.remove}}" aria-label="Stop sharing with {{e.name}}" style="min-height:36px;box-sizing:border-box;background:#E3EAF7;color:#1E3A8A;border:none;border-radius:18px;padding:0 6px 0 5px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;cursor:pointer">
                <span style="width:26px;height:26px;border-radius:13px;background:{{e.avBg}};color:{{e.avFg}};font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">{{e.ini}}</span>
                <span>{{e.name}}</span>
                <span aria-hidden="true" style="width:20px;height:20px;border-radius:10px;background:#1E3A8A;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </span>
              </button>
            </sc-if>
          </sc-for>
        </div>
        <input id="emp" placeholder="Search employees by name" style="height:32px;box-sizing:border-box;border:none;outline:none;font-size:14px;background:transparent;color:#14213D;padding:0 2px">
      </div>
      <sc-if value="{{hasSuggest}}" hint-placeholder-val="{{true}}">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <sc-for list="{{suggest}}" as="e" hint-placeholder-count="2">
            <button onClick="{{e.add}}" aria-label="Share with {{e.name}}" style="height:44px;box-sizing:border-box;border:1px dashed #1E3A8A;background:#FFFFFF;color:#1E3A8A;border-radius:22px;padding:0 14px 0 6px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;cursor:pointer">
              <span style="width:28px;height:28px;border-radius:14px;background:{{e.avBg}};color:{{e.avFg}};font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center">{{e.ini}}</span>
              <span>{{e.name}}</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#5B6472;line-height:1.4">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
        {{shareNote}}
      </span>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px">
      <label for="notes" style="font-size:12px;font-weight:700;color:#5B6472">Outcome / notes</label>
      <textarea id="notes" style="height:72px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:10px 14px;font-size:14px;background:#FFFFFF;color:#14213D;resize:none" placeholder="What was decided?"></textarea>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;flex:none">
      <span style="font-size:12px;font-weight:700;color:#5B6472">Attachments</span>
      <sc-for list="{{files}}" as="f" hint-placeholder-count="1">
        <div style="display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E6E2D8;border-radius:12px;padding:4px 4px 4px 10px">
          <span style="width:40px;height:40px;border-radius:10px;background:{{f.bg}};color:{{f.fg}};font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">{{f.kind}}</span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{f.name}}</span><span style="font-size:12px;color:#5B6472">{{f.size}}</span></div>
          <button onClick="{{f.remove}}" aria-label="Remove {{f.name}}" style="width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;color:#5B6472;cursor:pointer;flex:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
      <div style="display:flex;gap:8px">
        <button onClick="{{addFile}}" style="flex:1;height:48px;border-radius:12px;border:1px dashed #0F766E;background:#FFFFFF;color:#0B5C55;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8l9-9a3.7 3.7 0 015.2 5.2l-9 9a1.8 1.8 0 01-2.6-2.6l8.3-8.3"></path></svg>Add file</button>
        <button onClick="{{addPhoto}}" style="flex:1;height:48px;border-radius:12px;border:1px dashed #0F766E;background:#FFFFFF;color:#0B5C55;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo</button>
      </div>
    </div>

    <button onClick="{{toggleFollow}}" role="switch" aria-checked="{{followOn}}" style="display:flex;justify-content:space-between;align-items:center;background:#FFFFFF;border:1px solid #E6E2D8;border-radius:12px;padding:0 14px;height:52px;width:100%;flex:none;font-size:14px;font-weight:600;color:#14213D;text-align:left;cursor:pointer">
      <span>Needs follow-up</span>
      <span aria-hidden="true" style="width:46px;height:28px;border-radius:14px;background:{{trackBg}};position:relative;flex:none"><span style="position:absolute;left:{{knobLeft}};top:3px;width:22px;height:22px;border-radius:11px;background:#FFFFFF"></span></span>
    </button>
    <sc-if value="{{followOn}}" hint-placeholder-val="{{true}}">
      <div style="background:#FDF0DC;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;flex:none">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="fu" style="font-size:12px;font-weight:700;color:#8A4B08">What needs to be done</label>
          <input id="fu" value="Send revised SLA terms to Karim" style="height:48px;box-sizing:border-box;border:1px solid #E5CFA6;border-radius:12px;padding:0 14px;font-size:14px;background:#FFFFFF;color:#14213D">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="due" style="font-size:12px;font-weight:700;color:#8A4B08">Due date</label>
          <input id="due" value="Sat 24 Oct 2026" style="height:48px;box-sizing:border-box;border:1px solid #E5CFA6;border-radius:12px;padding:0 14px;font-size:14px;background:#FFFFFF;color:#14213D">
        </div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:12px;font-weight:700;color:#8A4B08">Owner</span>
          <div style="display:flex;gap:8px">
            <sc-for list="{{owners}}" as="o" hint-placeholder-count="3">
              <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="flex:1;height:44px;border-radius:12px;border:1px solid {{o.border}};background:{{o.bg}};color:{{o.fg}};font-weight:700;font-size:13px">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="padding:12px 20px 28px;display:flex;gap:10px;background:#F5F3EE;border-top:1px solid #E6E2D8">
    <button style="flex:1;height:52px;border-radius:14px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:700;font-size:15px">Save as planned</button>
    <a href="User_Today.dc.html" style="flex:1;height:52px;border-radius:14px;background:#0F766E;color:#FFFFFF;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center">Save as done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { shared: ['Sara', 'Rahul'], follow: true, owner: 'Sara', files: [{ name: 'Vendor_SLA_draft.pdf', size: '412 KB', kind: 'PDF' }], n: 1 };
  }
  renderVals() {
    const staff = [
      { key: 'Sara', name: 'Sara Ahmed', ini: 'SA', avBg: '#E8E4F5', avFg: '#3F2F8F' },
      { key: 'Rahul', name: 'Rahul Menon', ini: 'RM', avBg: '#FDE7E1', avFg: '#9A3412' },
      { key: 'Fatima', name: 'Fatima Noor', ini: 'FN', avBg: '#DDF1EE', avFg: '#0B5C55' },
      { key: 'Joseph', name: 'Joseph Mathew', ini: 'JM', avBg: '#FDF0DC', avFg: '#8A4B08' }
    ];
    const me = 'Sara';
    const sh = this.state.shared;
    const shared = staff.filter((e) => sh.includes(e.key)).map((e) => ({
      ...e, locked: e.key === me, removable: e.key !== me,
      remove: () => this.setState({ shared: this.state.shared.filter((k) => k !== e.key) })
    }));
    const suggest = staff.filter((e) => !sh.includes(e.key)).map((e) => ({
      ...e, add: () => this.setState({ shared: [...this.state.shared, e.key] })
    }));
    const others = shared.filter((e) => e.key !== me).length;
    const shareNote = others === 0
      ? 'Only you and the Admin will see this log.'
      : 'Only the people above and the Admin will see this log.';
    const on = this.state.follow;
    const owners = [['Sara', 'Sara'], ['Rahul', 'Rahul'], ['Admin', 'Admin']].map(([key, label]) => {
      const sel = this.state.owner === key;
      return {
        label, on: sel,
        bg: sel ? '#8A4B08' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#14213D', border: sel ? '#8A4B08' : '#E5CFA6',
        pick: () => this.setState({ owner: key })
      };
    });
    const tone = { PDF: ['#FDE7E1', '#9A3412'], DOC: ['#E3EAF7', '#1E3A8A'], IMG: ['#DDF1EE', '#0B5C55'] };
    const files = this.state.files.map((f, i) => ({
      ...f, bg: tone[f.kind][0], fg: tone[f.kind][1],
      remove: () => this.setState({ files: this.state.files.filter((_, j) => j !== i) })
    }));
    const n = this.state.n;
    return {
      shared, suggest, hasSuggest: suggest.length > 0, shareNote,
      files,
      addFile: () => this.setState({ files: [...this.state.files, { name: 'Meeting_notes_' + n + '.docx', size: '96 KB', kind: 'DOC' }], n: n + 1 }),
      addPhoto: () => this.setState({ files: [...this.state.files, { name: 'Photo_' + n + '.jpg', size: '2.1 MB', kind: 'IMG' }], n: n + 1 }),
      followOn: on, owners,
      trackBg: on ? '#0F766E' : '#D9D5CB', knobLeft: on ? '21px' : '3px',
      toggleFollow: () => this.setState({ follow: !on })
    };
  }
}
</script>
</body>
</html>
