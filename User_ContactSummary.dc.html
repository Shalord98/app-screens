<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact Summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit}
a{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="padding:28px 20px 6px;display:flex;align-items:center;justify-content:space-between">
    <a href="User_Contacts.dc.html" aria-label="Back to contacts" style="width:44px;height:44px;border-radius:22px;border:1px solid #D9D5CB;background:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <a href="User_EditContact.dc.html" style="height:44px;padding:0 18px;box-sizing:border-box;border-radius:22px;border:1px solid #D9D5CB;background:#FFFFFF;font-weight:700;font-size:13px;color:#14213D;display:flex;align-items:center">Edit</a>
  </div>

  <div style="padding:6px 20px 0;display:flex;align-items:center;gap:14px">
    <span style="width:64px;height:64px;border-radius:32px;background:#DDF1EE;color:#0B5C55;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none">KF</span>
    <div style="display:flex;flex-direction:column;gap:3px">
      <span style="font-size:22px;font-weight:800;letter-spacing:-0.3px">Karim Fadel</span>
      <span style="font-size:13px;color:#5B6472">Account Director · Gulf Logistics</span>
      <div style="display:flex;gap:6px;margin-top:3px">
        <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:#E3EAF7;color:#1E3A8A">Vendor</span>
        <span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:#E8E4F5;color:#3F2F8F">Key account</span>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 20px 0">
    <button style="height:48px;border-radius:14px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>Call</button>
    <button style="height:48px;border-radius:14px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email</button>
    <a href="User_AddLog.dc.html" style="height:48px;border-radius:14px;background:#0F766E;color:#FFFFFF;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log</a>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 20px 0">
    <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column"><span style="font-size:22px;font-weight:800">7</span><span style="font-size:11.5px;color:#5B6472;font-weight:500">Interactions</span></div>
    <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column"><span style="font-size:22px;font-weight:800">Today</span><span style="font-size:11.5px;color:#5B6472;font-weight:500">Last met</span></div>
    <div style="background:#FDF0DC;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column"><span style="font-size:22px;font-weight:800;color:#8A4B08">1</span><span style="font-size:11.5px;color:#8A4B08;font-weight:600">Open follow-up</span></div>
  </div>

  <div style="margin:14px 20px 0;background:#FDF0DC;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.6px;color:#8A4B08">FOLLOW-UP · DUE 24 OCT</span>
    <span style="font-size:14px;font-weight:700;color:#14213D">Send revised SLA terms back to Karim</span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:12px;font-weight:700;color:#5B6472;letter-spacing:0.6px">TIMELINE</span>
    </div>
    <sc-for list="{{history}}" as="h" hint-placeholder-count="3">
      <a href="User_LogDetail.dc.html" style="display:flex;gap:12px;color:inherit">
        <div style="display:flex;flex-direction:column;align-items:center;flex:none;width:12px;padding-top:6px">
          <span style="width:10px;height:10px;border-radius:5px;background:#0F766E"></span>
          <span style="flex:1;width:2px;background:#D9D5CB;margin-top:4px"></span>
        </div>
        <div style="flex:1;padding-bottom:10px;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:11.5px;color:#5B6472;font-weight:600">{{h.when}} · {{h.type}}</span>
          <span style="font-size:14px;font-weight:700">{{h.title}}</span>
          <span style="font-size:12.5px;color:#5B6472;line-height:1.4">{{h.note}}</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;align-self:center"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </div>

  <div style="height:76px;flex:none;background:#FFFFFF;border-top:1px solid #E6E2D8;display:flex;justify-content:space-around;align-items:center;padding:0 8px 8px;box-sizing:border-box">
    <a href="User_Today.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</a>
    <a href="User_Contacts.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#0F766E;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Contacts</a>
    <a href="User_Followups.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>Follow-ups</a>
    <a href="User_History.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>History</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      history: [
        { when: 'Today, 14:00', type: 'Meeting', title: 'Vendor contract review', note: 'With Amal Mansoor. SLA terms need a second pass.' },
        { when: '14 Oct', type: 'Call', title: 'Pricing clarification', note: 'Agreed to hold rates until Q1 if volume is confirmed.' },
        { when: '2 Oct', type: 'Meeting', title: 'Warehouse site visit', note: 'With Omar Rashid. Photos attached.' }
      ]
    };
  }
}
</script>
</body>
</html>
