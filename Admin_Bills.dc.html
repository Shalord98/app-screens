<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bills</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">
  <div style="padding:28px 20px 12px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:10px">
      <a href="Admin_More.dc.html" aria-label="Back to More" style="width:44px;height:44px;border-radius:22px;border:1px solid #D9D5CB;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#14213D;flex:none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="display:flex;flex-direction:column;gap:1px">
        <span style="font-size:13px;color:#5B6472;font-weight:500">5 accounts</span>
        <span style="font-size:24px;font-weight:800;letter-spacing:-0.5px">Bills</span>
      </div>
    </div>
    <button aria-label="Add bill" style="width:44px;height:44px;border-radius:22px;border:none;background:#0F766E;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 20px">
    <div style="background:#FDE7E1;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column"><span style="font-size:20px;font-weight:800;color:#9A3412">{{overdue}}</span><span style="font-size:11.5px;color:#9A3412;font-weight:700">Overdue</span></div>
    <div style="background:#FDF0DC;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column"><span style="font-size:20px;font-weight:800;color:#8A4B08">{{week}}</span><span style="font-size:11.5px;color:#8A4B08;font-weight:700">Due in 7 days</span></div>
    <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:14px;padding:8px 12px;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800;line-height:1.6">{{unpaidTotal}}</span><span style="font-size:11.5px;color:#5B6472;font-weight:600">Unpaid total</span></div>
  </div>

  <div style="margin:12px 20px 0;background:#E4E7EC;border-radius:12px;padding:3px;display:flex">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex:1;height:38px;border-radius:10px;border:none;background:{{t.bg}};color:#14213D;font-weight:{{t.weight}};font-size:13px">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex:1;overflow-y:auto;padding:12px 20px 20px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{list}}" as="b" hint-placeholder-count="4">
      <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:42px;height:42px;border-radius:12px;background:#EEF0F3;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">{{b.ini}}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14.5px;font-weight:700">{{b.acc}}</span>
            <span style="font-size:12px;color:#5B6472">{{b.month}} · due {{b.dueText}}</span>
          </span>
          <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none">
            <span style="font-size:14.5px;font-weight:800">{{b.amountText}}</span>
            <span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:9px;background:{{b.stBg}};color:{{b.stFg}}">{{b.status}}</span>
          </span>
        </div>
        <sc-if value="{{b.isUnpaid}}" hint-placeholder-val="{{true}}">
          <button onClick="{{b.markPaid}}" style="height:44px;border-radius:12px;border:1px solid #0F766E;background:#FFFFFF;color:#0B5C55;font-weight:700;font-size:14px">Mark paid</button>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="background:#FFFFFF;border:1px dashed #D9D5CB;border-radius:16px;padding:24px;text-align:center;font-size:14px;color:#5B6472">All bills are paid.</div>
    </sc-if>
  </div>
  <div style="height:76px;flex:none;background:#FFFFFF;border-top:1px solid #E6E2D8;display:flex;justify-content:space-around;align-items:center;padding:0 8px 8px;box-sizing:border-box">
    <a href="Main.dc.html" style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Today</a>
    <a href="Admin_Contacts.dc.html" style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1-4 4-6 8-6s7 2 8 6"></path></svg>Contacts</a>
    <a href="Admin_Followups.dc.html" style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>Follow-ups</a>
    <a href="FinPhone_Today.dc.html" style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path><path d="M16 15h2"></path></svg>Finance</a>
    <a href="Admin_More.dc.html" style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#0F766E;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg>More</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Unpaid', paidNow: {} }; }
  renderVals() {
    const today = new Date(2026, 9, 20);
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const D = (y, m, dd) => new Date(y, m - 1, dd);
    const fmt = (x) => x.getDate() + ' ' + MON[x.getMonth()] + ' ' + x.getFullYear();
    const short = (x) => x.getDate() + ' ' + MON[x.getMonth()];
    const daysTo = (x) => Math.round((x - today) / 86400000);
    const aed = (n) => 'AED ' + n.toLocaleString('en-US');
    const tone = { bad: ['#FDE7E1', '#9A3412'], warn: ['#FDF0DC', '#8A4B08'], soon: ['#E3EAF7', '#1E3A8A'], ok: ['#DDF1EE', '#0B5C55'], none: ['#EEF0F3', '#3D4654'] };
    const expChip = (x) => {
      if (!x) return { chip: 'Not added', chipBg: tone.none[0], chipFg: tone.none[1], days: 9999 };
      const n = daysTo(x);
      const t = n < 0 ? tone.bad : n <= 30 ? tone.warn : n <= 90 ? tone.soon : tone.ok;
      return { chip: n < 0 ? 'Expired ' + (-n) + 'd ago' : n <= 90 ? 'In ' + n + ' days' : 'Valid', chipBg: t[0], chipFg: t[1], days: n };
    };
    const accounts = {
      a1: { acc: 'DEWA – Villa', type: 'Electricity and water', provider: 'DEWA', number: '20••••••5517', ini: 'EW' },
      a2: { acc: 'du – Internet and TV', type: 'Internet and TV', provider: 'du', number: '0400••••88', ini: 'IN' },
      a3: { acc: 'Empower – Chiller', type: 'Chiller', provider: 'Empower', number: 'EMP-••••-311', ini: 'CH' },
      a4: { acc: 'Car lease – Nissan Patrol', type: 'Car lease', provider: 'Al Futtaim Leasing', number: 'LS-••••-902', ini: 'CL' },
      a5: { acc: 'Etisalat – Mobiles', type: 'Mobile', provider: 'Etisalat', number: '05••••••40', ini: 'MB' }
    };
    const rawBills = [
      { id: 'b1', a: 'a2', month: 'Oct 2026', amount: 399, due: D(2026, 10, 18), paid: null },
      { id: 'b2', a: 'a1', month: 'Oct 2026', amount: 1840, due: D(2026, 10, 22), paid: null },
      { id: 'b3', a: 'a3', month: 'Oct 2026', amount: 720, due: D(2026, 10, 28), paid: null },
      { id: 'b4', a: 'a4', month: 'Nov 2026', amount: 3200, due: D(2026, 11, 1), paid: null },
      { id: 'b5', a: 'a5', month: 'Oct 2026', amount: 650, due: D(2026, 10, 15), paid: D(2026, 10, 14) },
      { id: 'b6', a: 'a4', month: 'Oct 2026', amount: 3200, due: D(2026, 10, 1), paid: D(2026, 10, 1) },
      { id: 'b7', a: 'a1', month: 'Sep 2026', amount: 2105, due: D(2026, 9, 22), paid: D(2026, 9, 20) }
    ];
    const bills = rawBills.map((b) => {
      const paid = b.paid || (this.state.paidNow[b.id] ? today : null);
      const n = daysTo(b.due);
      const t = paid ? tone.ok : n < 0 ? tone.bad : n <= 7 ? tone.warn : tone.none;
      return {
        ...b, ...accounts[b.a], paidOn: paid, isPaid: !!paid, isUnpaid: !paid, amountText: aed(b.amount), dueText: short(b.due),
        status: paid ? 'Paid ' + short(paid) : n < 0 ? 'Overdue ' + (-n) + 'd' : n === 0 ? 'Due today' : 'Due in ' + n + 'd',
        stBg: t[0], stFg: t[1], days: n,
        markPaid: () => this.setState({ paidNow: { ...this.state.paidNow, [b.id]: true } })
      };
    });
    const st = this.state;
    const unpaid = bills.filter((b) => b.isUnpaid).sort((a, b) => a.days - b.days);
    const paid = bills.filter((b) => b.isPaid).sort((a, b) => b.paidOn - a.paidOn);
    const tabs = [['Unpaid', 'Unpaid · ' + unpaid.length], ['Paid', 'Paid · ' + paid.length]].map(([k, label]) => ({
      label, on: st.tab === k, bg: st.tab === k ? '#FFFFFF' : 'transparent', weight: st.tab === k ? 800 : 600, pick: () => this.setState({ tab: k }) }));
    const list = st.tab === 'Unpaid' ? unpaid : paid;
    return {
      tabs, list, isEmpty: list.length === 0,
      overdue: unpaid.filter((b) => b.days < 0).length,
      week: unpaid.filter((b) => b.days >= 0 && b.days <= 7).length,
      unpaidTotal: aed(unpaid.reduce((n, b) => n + b.amount, 0))
    };
  }
}
</script>
</body>
</html>
