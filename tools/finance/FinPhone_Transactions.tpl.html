<!--@HEAD Recent spending-->
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="padding:24px 20px 10px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:13px;color:#5B6472;font-weight:500">{{subtitle}}</span>
        <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.5px">Recent</h1>
      </div>
      <span style="font-size:13px;font-weight:700;color:#5B6472;font-variant-numeric:tabular-nums">{{total}}</span>
    </div>
    <div style="position:relative">
      <label for="rq" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search spending</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:14px;top:13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="rq" value="{{q}}" onChange="{{search}}" placeholder="Search payee, person or item" style="width:100%;height:44px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px 0 42px;font-size:14px;background:#FFFFFF;color:#14213D">
    </div>
    <div style="display:flex;background:#E4E7EC;border-radius:12px;padding:3px" role="group" aria-label="Show">
      <sc-for list="{{dirs}}" as="v" hint-placeholder-count="3">
        <button onClick="{{v.pick}}" aria-pressed="{{v.on}}" style="flex:1;height:36px;border-radius:10px;border:none;background:{{v.bg}};color:#14213D;font-weight:{{v.weight}};font-size:13px">{{v.label}}</button>
      </sc-for>
    </div>
  </div>

  <div data-scroll style="flex:1;overflow-y:auto;padding:2px 20px 20px;display:flex;flex-direction:column;gap:10px">
    <sc-if value="{{hasBanner}}" hint-placeholder-val="{{false}}">
      <div role="status" style="background:#14213D;color:#FFFFFF;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600">
        <span>{{banner}}</span>
        <button onClick="{{closeBanner}}" aria-label="Dismiss" style="height:32px;width:32px;flex:none;border-radius:8px;border:none;background:#2A3A5C;color:#FFFFFF;font-size:16px">×</button>
      </div>
    </sc-if>
    <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px;display:flex;flex-direction:column;overflow:hidden">
      <sc-for list="{{rows}}" as="t" hint-placeholder-count="8">
        <button onClick="{{t.open}}" style="width:100%;text-align:left;border:none;border-bottom:1px solid #EFEBE2;background:#FFFFFF;padding:11px 14px;display:flex;align-items:center;gap:12px;color:#14213D;min-height:60px">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{t.desc}}</span>
            <span style="font-size:12px;color:#5B6472;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{t.meta}}</span>
          </span>
          <span style="display:flex;flex-direction:column;align-items:flex-end;flex:none;gap:2px">
            <span style="font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:{{t.amtFg}}">{{t.amountText}}</span>
            <sc-if value="{{t.noReceipt}}" hint-placeholder-val="{{false}}"><span style="font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:8px;background:#E3EAF7;color:#1E3A8A">No receipt</span></sc-if>
          </span>
        </button>
      </sc-for>
      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
        <div style="padding:24px;text-align:center;font-size:14px;color:#5B6472">Nothing found.</div>
      </sc-if>
    </div>
    <span style="font-size:12.5px;color:#5B6472;text-align:center;padding:4px 10px 0;line-height:1.5">{{note}}</span>
  </div>

<!--@TABS FinPhone_Transactions.dc.html-->

  <sc-if value="{{detailOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;inset:0;background:rgba(20,33,61,0.45);display:flex;flex-direction:column;justify-content:flex-end;z-index:5">
      <div role="dialog" aria-label="Expense detail" style="background:#FFFFFF;border-radius:22px 22px 0 0;padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;font-weight:700;color:#5B6472">{{d.catName}} · {{d.fullDate}}</span>
          <button onClick="{{closeDetail}}" aria-label="Close" style="width:40px;height:40px;border-radius:20px;border:none;background:#EEF0F3;color:#14213D;font-size:18px">×</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <h2 style="margin:0;font-size:19px;font-weight:800;line-height:1.25">{{d.desc}}</h2>
          <span style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums">{{d.amountText}}</span>
          <span style="font-size:13px;color:#5B6472">{{d.line}}</span>
        </div>
        <sc-if value="{{d.noReceipt}}" hint-placeholder-val="{{false}}">
          <button onClick="{{d.addReceipt}}" style="height:50px;border-radius:14px;border:none;background:#1E3A8A;color:#FFFFFF;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Add receipt photo</button>
        </sc-if>
        <sc-if value="{{d.hasReceipt}}" hint-placeholder-val="{{true}}">
          <span style="font-size:13px;font-weight:700;padding:10px 12px;border-radius:12px;background:#DDF1EE;color:#0B5C55">Receipt attached</span>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', dir: 'all', open: null, added: {}, banner: '' };
  }
  renderVals() {
    /*@SHARED*/
    const st = this.state, LIMIT = 25;
    // Money out (expenses) and money in (income received), newest first.
    const outs = FIN.txns.concat(FIN.history).map((t) => ({ ...t, dir: 'out' }));
    const ins = FIN.income.filter((i) => i.received !== null).map((i) => {
      const src = FIN.sources.find((x) => x.id === i.src);
      return { id: 'in-' + i.id, dir: 'in', m: i.m, d: i.d, desc: i.src === 'other' ? i.ref : src.name, payee: src.from, amount: i.received, method: i.ref, srcName: src.name, receipt: true, p: '', o: '' };
    });
    const all = outs.concat(ins).sort((a, b) => b.m - a.m || b.d - a.d);
    const pName = (id) => (FIN.persons.find((x) => x.id === id) || {}).name || '';
    const oName = (id) => (FIN.objects.find((x) => x.id === id) || {}).name || '';
    const hasRc = (t) => t.receipt || !!st.added[t.id];
    const q = st.q.trim().toLowerCase();
    const inDir = all.filter((t) => st.dir === 'all' || t.dir === st.dir);
    const found = q ? inDir.filter((t) => (t.desc + ' ' + t.payee + ' ' + pName(t.p) + ' ' + oName(t.o)).toLowerCase().includes(q)) : inDir;
    const shown = found.slice(0, LIMIT);
    const rows = shown.map((t) => {
      const who = [pName(t.p), oName(t.o)].filter(Boolean).join(' · ');
      const isIn = t.dir === 'in';
      return { desc: t.desc, amountText: (isIn ? '+' : '−') + num(t.amount), amtFg: isIn ? '#0B5C55' : '#14213D', date: dateText(t.m, t.d), noReceipt: !hasRc(t), hasReceipt: hasRc(t),
        meta: dateText(t.m, t.d) + ' · ' + (isIn ? t.payee : who || catOf(t.cat).name), open: () => this.setState({ open: t.id }) };
    });
    const t = st.open && all.find((x) => x.id === st.open);
    const d = t ? {
      desc: t.desc, amountText: (t.dir === 'in' ? '+' : '−') + aed(t.amount), catName: t.dir === 'in' ? 'Money in · ' + t.srcName : catOf(t.cat).name, fullDate: t.d + ' ' + MONTHS[t.m],
      line: [t.payee, pName(t.p), oName(t.o), t.method].filter(Boolean).join(' · '),
      noReceipt: !hasRc(t), hasReceipt: hasRc(t),
      addReceipt: () => this.setState({ added: { ...st.added, [t.id]: true }, open: null, banner: 'Receipt added to ' + t.desc + '.' })
    } : {};
    return {
      q: st.q, search: (e) => this.setState({ q: e.target.value }),
      dirs: [['all', 'All'], ['out', 'Money out'], ['in', 'Money in']].map(([k, label]) => ({ label, on: st.dir === k, bg: st.dir === k ? '#FFFFFF' : 'transparent', weight: st.dir === k ? 800 : 600, pick: () => this.setState({ dir: k }) })),
      subtitle: q ? found.length + (found.length === 1 ? ' match' : ' matches') : 'Latest ' + shown.length + (st.dir === 'in' ? ' receipts' : st.dir === 'out' ? ' expenses' : ' transactions'),
      total: q && found.length ? (st.dir === 'all' ? 'Net ' + aed(sum(found.map((x) => (x.dir === 'in' ? x.amount : -x.amount)))) : aed(sum(found.map((x) => x.amount)))) : '',
      rows, isEmpty: rows.length === 0,
      note: found.length > LIMIT ? 'Showing the latest ' + LIMIT + '. Full history, filters and totals are in Finance on the laptop.' : 'Full history, filters and totals are in Finance on the laptop.',
      detailOpen: !!t, d, closeDetail: () => this.setState({ open: null }),
      hasBanner: !!st.banner, banner: st.banner, closeBanner: () => this.setState({ banner: '' })
    };
  }
}
</script>
</body>
</html>
