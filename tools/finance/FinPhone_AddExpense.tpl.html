<!--@HEAD Add expense-->
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="padding:24px 20px 10px;display:flex;flex-direction:column;gap:2px">
    <span style="font-size:13px;color:#5B6472;font-weight:500">Today, 20 Oct · Fatima Noor</span>
    <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.5px">Add expense</h1>
  </div>

  <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
    <div data-scroll style="flex:1;overflow-y:auto;padding:12px 20px 24px;display:flex;flex-direction:column;gap:14px">
      <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:18px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
        <span style="width:56px;height:56px;border-radius:28px;background:#DDF1EE;color:#0B5C55;display:flex;align-items:center;justify-content:center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg></span>
        <h2 style="margin:0;font-size:20px;font-weight:800">Expense saved</h2>
        <span style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums">{{last.amountText}}</span>
        <span style="font-size:14px;font-weight:700">{{last.desc}}</span>
        <span style="font-size:12.5px;color:#5B6472">{{last.line}}</span>
        <div style="width:100%;background:{{last.budgetBg}};border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:6px">
          <span style="font-size:11px;font-weight:700;letter-spacing:0.6px;color:{{last.budgetFg}}">{{last.budgetTitle}}</span>
          <span style="font-size:12.5px;font-weight:600;color:{{last.budgetFg}}">{{last.budgetLine}}</span>
        </div>
      </div>
      <button onClick="{{again}}" style="height:50px;border-radius:14px;border:none;background:#0F766E;color:#FFFFFF;font-weight:700;font-size:15px">Add another expense</button>
      <a href="FinPhone_Transactions.dc.html" style="height:50px;border-radius:14px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center">View recent</a>
    </div>
  </sc-if>

  <sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
    <div data-scroll style="flex:1;overflow-y:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:16px">
      <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
        <label for="eAmt" style="font-size:12px;font-weight:700;color:#5B6472">AMOUNT (AED)</label>
        <input id="eAmt" inputmode="decimal" value="{{f.amount}}" onChange="{{f.setAmount}}" placeholder="0" style="width:100%;min-width:0;height:50px;box-sizing:border-box;border:none;padding:0;font-size:34px;font-weight:800;background:transparent;color:#14213D;font-variant-numeric:tabular-nums">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="eDesc" style="font-size:13px;font-weight:700">What was it for?</label>
        <input id="eDesc" value="{{f.desc}}" onChange="{{f.setDesc}}" placeholder="e.g. Petrol, groceries, visa fees" style="width:100%;min-width:0;height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px;font-size:15px;background:#FFFFFF;color:#14213D">
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:13px;font-weight:700">Category</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <sc-for list="{{f.cats}}" as="o" hint-placeholder-count="7">
            <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height:38px;padding:0 13px;border-radius:19px;border:1px solid {{o.border}};background:{{o.bg}};color:{{o.fg}};font-weight:600;font-size:13px">{{o.label}}</button>
          </sc-for>
          <button onClick="{{f.toggleCats}}" aria-expanded="{{f.allCats}}" style="height:38px;padding:0 13px;border-radius:19px;border:1px dashed #9AA3AF;background:transparent;color:#0B5C55;font-weight:700;font-size:13px">{{f.catsToggleLabel}}</button>
        </div>
      </div>
      <button onClick="{{f.toggleReceipt}}" style="min-height:52px;border:1px dashed {{f.rcBorder}};border-radius:12px;background:{{f.rcBg}};color:{{f.rcFg}};font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>{{f.rcLabel}}</button>
      <button onClick="{{f.toggleMore}}" aria-expanded="{{f.more}}" style="min-height:44px;border:none;background:transparent;color:#0B5C55;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:space-between;padding:0 2px">
        <span>{{f.moreLabel}}</span><span style="font-size:12.5px;color:#5B6472;font-weight:600">{{f.moreHint}}</span></button>
      <sc-if value="{{f.more}}" hint-placeholder-val="{{false}}">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label for="ePayee" style="font-size:13px;font-weight:700">Paid to</label>
          <input id="ePayee" value="{{f.payee}}" onChange="{{f.setPayee}}" placeholder="Shop or company" style="width:100%;min-width:0;height:48px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px;font-size:15px;background:#FFFFFF;color:#14213D">
        </div>
        <sc-for list="{{f.groups}}" as="g" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:8px">
            <span style="font-size:13px;font-weight:700">{{g.title}}</span>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="5">
                <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height:36px;padding:0 12px;border-radius:18px;border:1px solid {{o.border}};background:{{o.bg}};color:{{o.fg}};font-weight:600;font-size:13px">{{o.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <div style="display:flex;flex-direction:column;gap:8px">
          <span style="font-size:13px;font-weight:700">Repeats</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{f.freqs}}" as="o" hint-placeholder-count="4">
              <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height:36px;padding:0 12px;border-radius:18px;border:1px solid {{o.border}};background:{{o.bg}};color:{{o.fg}};font-weight:600;font-size:13px">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>
    <div style="padding:10px 20px 18px;background:#F5F3EE;border-top:1px solid #E6E2D8">
      <button onClick="{{f.save}}" disabled="{{f.saveDisabled}}" style="width:100%;height:52px;border-radius:14px;border:none;background:{{f.saveBg}};color:#FFFFFF;font-weight:700;font-size:16px">{{f.saveLabel}}</button>
    </div>
  </sc-if>

<!--@TABS FinPhone_AddExpense.dc.html-->
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { form: this.blank(), last: null };
  }
  blank() { return { amount: '', desc: '', payee: '', cat: '', p: '', o: '', method: 'Card ••4417', type: 'One-off', freq: 'Monthly', receipt: false, more: false, allCats: false }; }
  renderVals() {
    /*@SHARED*/
    const st = this.state, fm = st.form;
    const setF = (patch) => this.setState({ form: { ...this.state.form, ...patch } });
    const choice = (on) => ({ on, bg: on ? '#0F766E' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14213D', border: on ? '#0F766E' : '#D9D5CB' });
    // Person and object are optional: tapping the selected one again clears it.
    const used = {};
    FIN.history.concat(FIN.txns).forEach((t) => { used[t.cat] = (used[t.cat] || 0) + 1; });
    const topCats = FIN.cats.slice().sort((a, b) => (used[b.id] || 0) - (used[a.id] || 0)).slice(0, 6).map((c) => c.id);
    const opts = (key, list, optional) => list.map((x) => ({ label: x.name, ...choice(fm[key] === x.id), pick: () => setF({ [key]: optional && fm[key] === x.id ? '' : x.id }) }));
    const amt = Number(String(fm.amount).replace(/[^0-9.]/g, ''));
    const ok = fm.desc.trim().length > 0 && amt > 0 && !!fm.cat;
    const f = {
      ...fm,
      setAmount: (e) => setF({ amount: e.target.value }), setDesc: (e) => setF({ desc: e.target.value }), setPayee: (e) => setF({ payee: e.target.value }),
      // The 6 most-used categories first; the rest behind "More categories". A picked category always stays visible.
      cats: opts('cat', fm.allCats ? FIN.cats : FIN.cats.filter((c) => topCats.includes(c.id) || c.id === fm.cat), false),
      allCats: fm.allCats, toggleCats: () => setF({ allCats: !fm.allCats }),
      catsToggleLabel: fm.allCats ? 'Fewer' : 'More categories (' + (FIN.cats.length - topCats.length) + ')',
      more: fm.more, toggleMore: () => setF({ more: !fm.more }),
      moreLabel: fm.more ? 'Hide details' : 'More details (optional)',
      moreHint: fm.more ? '' : [(FIN.persons.find((x) => x.id === fm.p) || {}).name, (FIN.objects.find((x) => x.id === fm.o) || {}).name, fm.type === 'Recurring' ? 'repeats ' + fm.freq.toLowerCase() : ''].filter(Boolean).join(' · ') || 'person, vehicle, paid with',
      groups: [
        { title: 'For person', opts: opts('p', FIN.persons, true) },
        { title: 'Vehicle or property', opts: opts('o', FIN.objects, true) },
        { title: 'Paid with', opts: ['Card ••4417', 'Bank transfer', 'Petty cash', 'Fuel card'].map((k) => ({ label: k, ...choice(fm.method === k), pick: () => setF({ method: k }) })) }
      ],
      freqs: [['One-off', 'No'], ['Monthly', 'Monthly'], ['Quarterly', 'Quarterly'], ['Yearly', 'Yearly']].map(([k, label]) => {
        const on = k === 'One-off' ? fm.type === 'One-off' : fm.type === 'Recurring' && fm.freq === k;
        return { label, ...choice(on), pick: () => setF(k === 'One-off' ? { type: 'One-off' } : { type: 'Recurring', freq: k }) };
      }),
      rcLabel: fm.receipt ? 'Receipt photo added · tap to remove' : 'Take a photo of the receipt',
      rcBorder: fm.receipt ? '#0F766E' : '#9AA3AF', rcBg: fm.receipt ? '#DDF1EE' : '#FFFFFF', rcFg: fm.receipt ? '#0B5C55' : '#3D4654',
      toggleReceipt: () => setF({ receipt: !fm.receipt }),
      saveDisabled: !ok, saveBg: ok ? '#0F766E' : '#9FB8B5', saveLabel: ok ? 'Save ' + aed(amt) : !(amt > 0) ? 'Enter the amount' : !fm.desc.trim() ? 'Say what it was for' : 'Pick a category',
      save: () => { if (ok) this.setState({ last: { ...fm, amount: amt }, form: this.blank() }); }
    };
    let last = {};
    if (st.last) {
      const l = st.last, cat = FIN.cats.find((c) => c.id === l.cat), m = FIN.today.m;
      const used = spentOf(cat, m) + l.amount, alloc = cat.alloc[m], p = used / alloc, t = p > 1 ? tone.bad : p >= 0.8 ? tone.warn : tone.ok;
      const who = [(FIN.persons.find((x) => x.id === l.p) || {}).name, (FIN.objects.find((x) => x.id === l.o) || {}).name].filter(Boolean).join(' · ');
      last = { amountText: aed(l.amount), desc: l.desc.trim(), line: [cat.name, who, l.method, l.type === 'Recurring' ? 'repeats ' + l.freq.toLowerCase() : 'one-off', l.receipt ? 'receipt added' : 'no receipt'].filter(Boolean).join(' · '),
        budgetTitle: cat.name.toUpperCase() + ' · OCTOBER BUDGET', budgetBg: t[0], budgetFg: t[1], budgetBar: Math.min(100, p * 100).toFixed(0) + '%',
        budgetLine: aed(used) + ' of ' + aed(alloc) + ' used (' + Math.round(p * 100) + '%)' };
    }
    return { f, saved: !!st.last, editing: !st.last, last, again: () => this.setState({ last: null }) };
  }
}
</script>
</body>
</html>
