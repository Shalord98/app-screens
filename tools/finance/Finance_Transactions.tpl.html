<!--@HEAD All transactions-->
<div style="min-height:900px;background:#F5F3EE;color:#14213D;display:flex;flex-wrap:wrap;align-items:stretch;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

<!--@NAV Finance_Transactions.dc.html-->

  <main style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:28px 32px 32px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:13px;color:#5B6472;font-weight:500">Every payment out and every receipt in, in one list</span>
        <h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:-0.5px">All transactions</h1>
      </div>
      <div style="position:relative;flex:0 1 300px">
        <label for="tq" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search transactions</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position:absolute;left:14px;top:13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="tq" value="{{q}}" onChange="{{search}}" placeholder="Search description, payee, person" style="width:100%;height:44px;box-sizing:border-box;border:1px solid #D9D5CB;border-radius:12px;padding:0 14px 0 42px;font-size:14px;background:#FFFFFF;color:#14213D">
      </div>
    </div>

    <!--@FILTERBAR-->

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px">
      <div style="background:#DDF1EE;border-radius:16px;padding:12px 18px;display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700;color:#0B5C55">Money in</span><span style="font-size:22px;font-weight:800;color:#0B5C55;font-variant-numeric:tabular-nums">{{inTotal}}</span><span style="font-size:12px;color:#0B5C55">{{inCount}}</span></div>
      <div style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px;padding:12px 18px;display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700;color:#5B6472">Money out</span><span style="font-size:22px;font-weight:800;font-variant-numeric:tabular-nums">{{outTotal}}</span><span style="font-size:12px;color:#5B6472">{{outCount}}</span></div>
      <div style="background:{{netBg}};border-radius:16px;padding:12px 18px;display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700;color:{{netFg}}">Net</span><span style="font-size:22px;font-weight:800;color:{{netFg}};font-variant-numeric:tabular-nums">{{netTotal}}</span><span style="font-size:12px;color:{{netFg}}">{{netLine}}</span></div>
    </div>

    <div style="overflow-x:auto;background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px">
      <div style="min-width:820px;display:flex;flex-direction:column">
        <div style="display:flex;gap:12px;padding:6px 16px;border-bottom:1px solid #E6E2D8;font-size:11px;font-weight:700;letter-spacing:0.6px;color:#5B6472;align-items:center">
          <button onClick="{{sortDate}}" aria-label="{{sortDateAria}}" style="width:70px;flex:none;height:32px;border:none;background:transparent;padding:0;text-align:left;font:inherit;letter-spacing:0.6px;color:{{dateHeadFg}}">DATE {{dateArrow}}</button>
          <span style="flex:2;min-width:0">DESCRIPTION</span>
          <span style="width:150px;flex:none">CATEGORY</span>
          <span style="width:140px;flex:none">FOR</span>
          <button onClick="{{sortAmount}}" aria-label="{{sortAmountAria}}" style="width:200px;flex:none;height:32px;border:none;background:transparent;padding:0;text-align:right;font:inherit;letter-spacing:0.6px;color:{{amtHeadFg}}">IN / OUT {{amtArrow}}</button>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <button onClick="{{r.toggle}}" aria-expanded="{{r.open}}" style="width:100%;text-align:left;border:none;border-bottom:1px solid #EFEBE2;background:{{r.bg}};padding:10px 16px;display:flex;align-items:center;gap:12px;color:#14213D">
            <span style="width:70px;flex:none;font-size:12.5px;font-weight:700;color:#5B6472">{{r.date}}</span>
            <span style="flex:2;min-width:0;display:flex;flex-direction:column;gap:2px">
              <span style="font-size:14px;font-weight:700">{{r.desc}}</span>
              <span style="font-size:12px;color:#5B6472">{{r.sub}}</span>
            </span>
            <span style="width:150px;flex:none"><span style="font-size:11px;font-weight:700;padding:3px 9px;border-radius:9px;background:{{r.catBg}};color:{{r.catFg}};white-space:nowrap">{{r.catName}}</span></span>
            <span style="width:140px;flex:none;font-size:12.5px;color:#3D4654">{{r.forText}}</span>
            <span style="width:100px;flex:none;text-align:right;font-size:14px;font-weight:800;color:#0B5C55;font-variant-numeric:tabular-nums">{{r.inText}}</span>
            <span style="width:88px;flex:none;text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums">{{r.outText}}</span>
          </button>
          <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
            <div style="display:flex;flex-wrap:wrap;gap:8px 28px;padding:10px 16px 14px 98px;background:#F7FBFA;border-bottom:1px solid #EFEBE2;font-size:12.5px">
              <sc-for list="{{r.details}}" as="dt" hint-placeholder-count="4">
                <span style="display:flex;flex-direction:column"><span style="color:#5B6472;font-weight:600">{{dt.k}}</span><b>{{dt.v}}</b></span>
              </sc-for>
            </div>
          </sc-if>
        </sc-for>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
          <div style="padding:28px;text-align:center;font-size:14px;color:#5B6472">No transactions match these filters.</div>
        </sc-if>
        <sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}">
          <button onClick="{{showMore}}" style="margin:12px 16px 0;height:40px;border-radius:10px;border:1px solid #D9D5CB;background:#FFFFFF;color:#14213D;font-weight:700;font-size:13px">{{moreLabel}}</button>
        </sc-if>
        <div style="display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:13px;font-weight:800">
          <span>{{countLine}}</span><span style="font-variant-numeric:tabular-nums">{{footLine}}</span>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fb: { period: 'ytd', dir: [], cat: [], p: [], o: [] }, open: null, q: '', sort: { by: 'date', desc: true }, limit: 50, expanded: null };
  }
  renderVals() {
    /*@SHARED*/
    const st = this.state;
    const pName = (id) => (FIN.persons.find((x) => x.id === id) || {}).name || '';
    const oName = (id) => (FIN.objects.find((x) => x.id === id) || {}).name || '';

    // The ledger: every expense paid plus every income actually received.
    const outRows = FIN.txns.concat(FIN.history).map((t) => ({
      id: t.id, m: t.m, d: t.d, dir: 'out', desc: t.desc, sub: t.payee + ' · ' + t.method, cat: t.cat, catName: catOf(t.cat).name, catBg: catColor[t.cat][0], catFg: catColor[t.cat][1],
      p: t.p || '', o: t.o || '', amount: t.amount,
      details: [['Paid to', t.payee], ['Paid with', t.method], ['Type', t.type], ['Entered by', t.by], ['Receipt', t.receipt ? 'Attached' : 'Missing']]
    }));
    const inRows = FIN.income.filter((i) => i.received !== null).map((i) => {
      const s = FIN.sources.find((x) => x.id === i.src);
      return { id: 'in-' + i.id, m: i.m, d: i.d, dir: 'in', desc: s.name, sub: s.from + ' · ' + i.ref, cat: 'src:' + s.id, catName: s.name, catBg: '#DDF1EE', catFg: '#0B5C55',
        p: '', o: s.id === 'rent' ? 'apt' : '', amount: i.received,
        details: [['From', s.from], ['Reference', i.ref], ['Expected', aed(i.expected)], ['Received', aed(i.received)], ['Difference', i.received === i.expected ? 'None' : aed(i.received - i.expected)]] };
    });
    const all = outRows.concat(inRows);
    const q = st.q.trim().toLowerCase();
    const searched = q ? all.filter((r) => (r.desc + ' ' + r.sub + ' ' + pName(r.p) + ' ' + oName(r.o)).toLowerCase().includes(q)) : all;

    const defs = [
      periodDef((r) => r.m),
      listDef('dir', 'In / out', [{ v: 'in', label: 'Money in' }, { v: 'out', label: 'Money out' }], (r) => r.dir),
      listDef('cat', 'Category', [{ head: 'Money out' }].concat(FIN.cats.map((c) => ({ v: c.id, label: c.name })), [{ head: 'Money in' }], FIN.sources.map((s) => ({ v: 'src:' + s.id, label: s.name }))), (r) => r.cat),
      listDef('p', 'Person', FIN.persons.map((x) => ({ v: x.id, label: x.name })), (r) => r.p),
      listDef('o', 'Vehicle / property', FIN.objects.map((x) => ({ v: x.id, label: x.name })), (r) => r.o)
    ];
    const fb = filterBar(searched, st.fb, st.open,
      (patch, close) => this.setState({ fb: { ...this.state.fb, ...patch }, limit: 50, ...(close ? { open: null } : {}) }),
      (k) => this.setState({ open: k }), defs);

    const sorted = fb.filtered.slice().sort((a, b) => {
      const v = st.sort.by === 'date' ? (a.m - b.m) || (a.d - b.d) : a.amount - b.amount;
      return st.sort.desc ? -v : v;
    });
    const rows = sorted.slice(0, st.limit).map((r) => {
      const open = st.expanded === r.id;
      return { ...r, open, bg: open ? '#F0F8F6' : '#FFFFFF', date: dateText(r.m, r.d),
        forText: [pName(r.p), oName(r.o)].filter(Boolean).join(' · ') || '—',
        inText: r.dir === 'in' ? '+' + num(r.amount) : '', outText: r.dir === 'out' ? '−' + num(r.amount) : '',
        details: r.details.map(([k, v]) => ({ k, v })),
        toggle: () => this.setState({ expanded: open ? null : r.id }) };
    });

    const ins = fb.filtered.filter((r) => r.dir === 'in'), outs = fb.filtered.filter((r) => r.dir === 'out');
    const inT = sum(ins.map((r) => r.amount)), outT = sum(outs.map((r) => r.amount)), net = inT - outT;
    const s = st.sort;
    const sortBy = (by) => () => this.setState({ sort: { by, desc: s.by === by ? !s.desc : true } });
    return {
      fb, q: st.q, search: (e) => this.setState({ q: e.target.value, limit: 50 }),
      rows, isEmpty: rows.length === 0,
      inTotal: aed(inT), inCount: ins.length + (ins.length === 1 ? ' receipt' : ' receipts'),
      outTotal: aed(outT), outCount: outs.length + (outs.length === 1 ? ' payment' : ' payments'),
      netTotal: (net < 0 ? '−' : '+') + aed(Math.abs(net)), netLine: net < 0 ? 'More went out than came in' : 'More came in than went out',
      netBg: net < 0 ? '#FDE7E1' : '#DDF1EE', netFg: net < 0 ? '#9A3412' : '#0B5C55',
      sortDate: sortBy('date'), sortAmount: sortBy('amount'),
      dateArrow: s.by === 'date' ? (s.desc ? '↓' : '↑') : '', amtArrow: s.by === 'amount' ? (s.desc ? '↓' : '↑') : '',
      dateHeadFg: s.by === 'date' ? '#14213D' : '#5B6472', amtHeadFg: s.by === 'amount' ? '#14213D' : '#5B6472',
      sortDateAria: 'Sort by date, ' + (s.by === 'date' && s.desc ? 'oldest first' : 'newest first'),
      sortAmountAria: 'Sort by amount, ' + (s.by === 'amount' && s.desc ? 'smallest first' : 'largest first'),
      hasMore: sorted.length > st.limit, moreLabel: 'Show ' + Math.min(100, sorted.length - st.limit) + ' more (' + (sorted.length - st.limit) + ' left)',
      showMore: () => this.setState({ limit: st.limit + 100 }),
      countLine: sorted.length + (sorted.length === 1 ? ' transaction' : ' transactions'),
      footLine: 'In ' + aed(inT) + ' · Out ' + aed(outT)
    };
  }
}
</script>
</body>
</html>
