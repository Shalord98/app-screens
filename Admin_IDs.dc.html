<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document Vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F5F3EE;color:#14213D;display:flex;flex-direction:column;overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif">

  <div style="padding:28px 20px 12px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:13px;color:#5B6472;font-weight:500">{{summary}}</span>
      <span style="font-size:26px;font-weight:800;letter-spacing:-0.5px">Document Vault</span>
    </div>
    <a href="Admin_AddDocument.dc.html" aria-label="Add document" style="width:44px;height:44px;border-radius:22px;background:#0F766E;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 20px">
    <sc-for list="{{bands}}" as="b" hint-placeholder-count="4">
      <button onClick="{{b.pick}}" aria-pressed="{{b.on}}" style="height:64px;border-radius:14px;border:{{b.border}};background:{{b.bg}};color:{{b.fg}};display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 10px;gap:1px">
        <span style="font-size:20px;font-weight:800;line-height:1.1">{{b.count}}</span>
        <span style="font-size:11px;font-weight:700;white-space:nowrap">{{b.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto">
    <sc-for list="{{holders}}" as="h" hint-placeholder-count="4">
      <button onClick="{{h.pick}}" aria-pressed="{{h.on}}" style="height:34px;padding:0 14px;border-radius:17px;border:1px solid {{h.border}};background:{{h.bg}};color:{{h.fg}};font-weight:600;font-size:13px;white-space:nowrap;flex:none">{{h.label}}</button>
    </sc-for>
  </div>

  <div style="flex:1;overflow-y:auto;padding:10px 20px 20px;display:flex;flex-direction:column;gap:10px">
    <span style="font-size:12px;font-weight:700;color:#5B6472;letter-spacing:0.6px">{{listTitle}}</span>
    <sc-for list="{{docs}}" as="d" hint-placeholder-count="5">
      <a href="Admin_IDDetail.dc.html" style="background:#FFFFFF;border:1px solid #E6E2D8;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:#14213D">
        <span style="width:44px;height:44px;border-radius:12px;background:#EEF0F3;color:#14213D;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">{{d.abbr}}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15px;font-weight:700">{{d.type}}</span>
          <span style="font-size:12.5px;color:#5B6472">{{d.holder}} · {{d.masked}}</span>
          <span style="font-size:12px;color:#5B6472">Expires {{d.expiry}}</span>
        </span>
        <span style="font-size:11px;font-weight:700;padding:4px 9px;border-radius:10px;background:{{d.chipBg}};color:{{d.chipFg}};flex:none;text-align:center">{{d.chip}}</span>
      </a>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div style="background:#FFFFFF;border:1px dashed #D9D5CB;border-radius:16px;padding:24px 18px;text-align:center;font-size:14px;color:#5B6472">No documents match this filter.</div>
    </sc-if>
    <div style="display:flex;align-items:center;gap:6px;justify-content:center;padding-top:4px;font-size:12px;color:#5B6472;font-weight:600">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg>
      <span>Numbers are hidden until you tap Show</span>
    </div>
  </div>

  <div style="height:76px;flex:none;background:#FFFFFF;border-top:1px solid #E6E2D8;display:flex;justify-content:space-around;align-items:center;padding:0 8px 8px;box-sizing:border-box">
    <a href="Main.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Today</a>
    <a href="Admin_Contacts.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1-4 4-6 8-6s7 2 8 6"></path></svg>Contacts</a>
    <a href="Admin_Followups.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>Follow-ups</a>
    <a href="FinPhone_Today.dc.html" style="min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5B6472;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2.5"></rect><path d="M3 10h18"></path><path d="M16 15h2"></path></svg>Finance</a>
    <a href="Admin_More.dc.html" style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#0F766E;font-size:11px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"></rect></svg>More</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { band: 'All', holder: 'All' };
  }
  renderVals() {
    const st = this.state;
    const today = new Date(2026, 9, 20);
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const D = (y, m, d) => new Date(y, m - 1, d);
    const all = [
      { type: 'Passport', abbr: 'PP', holder: 'CEO', masked: '••••••4417', exp: D(2026, 11, 12) },
      { type: 'Emirates ID', abbr: 'EID', holder: 'CEO', masked: '784-••••-•••••••-2', exp: D(2028, 8, 3) },
      { type: 'Driving licence', abbr: 'DL', holder: 'CEO', masked: '••••3390', exp: D(2027, 1, 18) },
      { type: 'US visa (B1/B2)', abbr: 'VISA', holder: 'CEO', masked: '••••••8821', exp: D(2029, 3, 2) },
      { type: 'Residence visa', abbr: 'VISA', holder: 'Ravi Kumar', masked: '201/••••/•••512', exp: D(2026, 10, 9) },
      { type: 'Emirates ID', abbr: 'EID', holder: 'Ravi Kumar', masked: '784-••••-•••••••-7', exp: D(2026, 10, 9) },
      { type: 'Residence visa', abbr: 'VISA', holder: 'Maria Santos', masked: '201/••••/•••094', exp: D(2027, 1, 5) },
      { type: 'Passport', abbr: 'PP', holder: 'Maria Santos', masked: '••••••7703', exp: D(2030, 6, 30) }
    ];
    const band = (days) => days < 0 ? 'Expired' : days <= 30 ? '30 days' : days <= 90 ? '90 days' : 'Valid';
    const tone = {
      Expired: ['#FDE7E1', '#9A3412'], '30 days': ['#FDF0DC', '#8A4B08'],
      '90 days': ['#E3EAF7', '#1E3A8A'], Valid: ['#DDF1EE', '#0B5C55']
    };
    const rows = all.map((x) => {
      const days = Math.round((x.exp - today) / 86400000);
      const b = band(days);
      return {
        ...x, days, band: b,
        expiry: x.exp.getDate() + ' ' + MON[x.exp.getMonth()] + ' ' + x.exp.getFullYear(),
        chip: days < 0 ? 'Expired ' + (-days) + 'd ago' : days <= 90 ? 'In ' + days + ' days' : 'Valid',
        chipBg: tone[b][0], chipFg: tone[b][1]
      };
    }).sort((a, b) => a.days - b.days);
    const byHolder = rows.filter((r) => st.holder === 'All' || r.holder === st.holder);
    const docs = byHolder.filter((r) => st.band === 'All' || r.band === st.band);
    const bands = ['Expired', '30 days', '90 days', 'Valid'].map((k) => {
      const on = st.band === k;
      return {
        label: k === '30 days' ? '≤ 30 days' : k === '90 days' ? '≤ 90 days' : k, on,
        count: byHolder.filter((r) => r.band === k).length,
        bg: tone[k][0], fg: tone[k][1], border: on ? '2px solid ' + tone[k][1] : '2px solid transparent',
        pick: () => this.setState({ band: on ? 'All' : k })
      };
    });
    const holders = ['All', 'CEO', 'Ravi Kumar', 'Maria Santos'].map((h) => {
      const on = st.holder === h;
      return { label: h === 'All' ? 'Everyone' : h, on, bg: on ? '#14213D' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14213D', border: on ? '#14213D' : '#D9D5CB', pick: () => this.setState({ holder: h }) };
    });
    return {
      bands, holders, docs, isEmpty: docs.length === 0,
      summary: all.length + ' documents · 3 people',
      listTitle: (st.band === 'All' ? 'ALL DOCUMENTS' : st.band === 'Expired' ? 'EXPIRED' : st.band === 'Valid' ? 'VALID' : 'EXPIRING WITHIN ' + st.band.toUpperCase()) + ' · ' + docs.length + ' · SOONEST FIRST'
    };
  }
}
</script>
</body>
</html>
